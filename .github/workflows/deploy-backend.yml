name: Deploy Backend (Staging)

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch: {}

env:
  REGION: asia-northeast1
  REPOSITORY: backend
  SERVICE: ai-health-checker-api
  PROJECT_ID: ai-health-checker-stg

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_STAGING }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          docker build -t $IMAGE backend/
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          project_id: ${{ env.PROJECT_ID }}
          # --set-env-vars はプレーン環境変数を全置換するため、--clear-env-vars と同様に
          # 古い変数の残留を防げる（両フラグは併用不可）。^;^ は値内カンマのための区切り文字指定
          # 旧ドメイン shunniehub.com は 2027 年の閉鎖まで移行期間として許可する
          # Anthropic API は API キーではなく Workload Identity Federation で認証する（#136）。
          # ANTHROPIC_* の ID はシークレットではない。ANTHROPIC_API_KEY を設定すると
          # API キーが優先されて ID 連携が無効になるため、--set-secrets に含めない
          flags: >-
            --port=8080 --allow-unauthenticated
            --service-account=ai-health-checker-api@ai-health-checker-stg.iam.gserviceaccount.com
            --set-env-vars=^;^CORS_ALLOWED_ORIGINS=https://ai-health-checker.nokono.net,https://ai-health-checker.shunniehub.com,https://ai-health-checker--ai-health-checker-stg.asia-east1.hosted.app,http://localhost:3000;ANTHROPIC_FEDERATION_RULE_ID=fdrl_01Bsi5CkHkSJ74AjhP9srciv;ANTHROPIC_ORGANIZATION_ID=e2ff6684-c6f8-41e4-86e8-eb557076e808;ANTHROPIC_SERVICE_ACCOUNT_ID=svac_01KLx5dRCULiC5bj2NXpo1eB;ANTHROPIC_WORKSPACE_ID=wrkspc_019p6Lfs8dAx2YEgKV5A8d6K
            --set-secrets=SCHEDULER_API_KEY=SCHEDULER_API_KEY:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest,EMAIL_FROM=EMAIL_FROM:latest
